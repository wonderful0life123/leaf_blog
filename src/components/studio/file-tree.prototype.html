<style>
:root{color-scheme:light;--bg:#edf3ef;--card:#fff;--ink:#243830;--muted:#718178;--line:#e1eae4;--green:#17855c;--soft:#e8f5ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1,h2,h3,p{margin:0}h1{font-size:29px;margin:5px 0}h2{font-size:18px}h3{font-size:14px}.brand{color:var(--green);font-weight:650;letter-spacing:2px}.intro{max-width:920px;color:var(--muted)}.top{display:flex;gap:24px;justify-content:space-between;align-items:center}.pill{display:inline-block;border-radius:7px;background:var(--soft);color:var(--green);font-size:12px;padding:3px 9px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit}button{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:var(--soft);color:var(--green);border-color:#98ccb1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91cdb4;outline-offset:2px}.walk{margin-top:24px;border:1px solid var(--line);border-radius:12px;background:#f8fbf9;padding:16px}.walk .tools{margin-bottom:10px}.walk p{color:var(--muted);margin:8px 0}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.sub{font-size:13px;color:var(--muted);font-weight:400}.tree{padding:14px;min-height:245px}.node{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;border-radius:7px;padding:8px 10px;margin:2px 0;background:transparent;line-height:1.45}.node.selected{background:var(--soft);color:var(--green)}.node.folder{font-weight:600}.glyph{color:var(--green);font-size:17px;min-width:18px}.count{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}.tree ul{list-style:none;margin:0;padding:0}.tree ul ul{margin-left:19px;padding-left:10px;border-left:1px solid var(--line)}.muted{color:var(--muted)}.empty{padding:16px;font-size:13px;color:var(--muted)}.detail{border-top:1px solid var(--line);padding:20px 22px;background:#fcfefd}.detail h3{font-size:17px;margin-bottom:12px}.facts{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:13px;margin-bottom:16px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.url{color:var(--green)}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;color:var(--ink);background:#fff}.formrow{display:flex;gap:8px;align-items:center}.formrow input,.formrow select{flex:1;min-width:0}.hint{font-size:12px;color:var(--muted);margin-top:6px}.pending{padding:18px 22px;border-top:1px solid var(--line)}.change{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.change strong{display:block}.change span{display:block;color:var(--muted)}.status{margin-top:16px;padding:12px 16px;border-radius:9px;background:var(--soft);color:var(--green);min-height:48px}.new{padding:0 22px 18px}.public-note{border-top:1px solid var(--line);padding:16px 22px;font-size:13px;color:var(--muted)}.public-article{padding:6px 10px;font-size:14px}.public-article small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.footer{color:var(--muted);font-size:12px;margin:18px 0}.select-label{color:var(--green)}@media(max-width:850px){main{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}h1{font-size:24px}.head{padding:15px}.formrow{flex-wrap:wrap}.formrow select{flex-basis:100%}.facts{grid-template-columns:75px 1fr}}

main{max-width:1160px}.top{margin-bottom:20px}.intro{max-width:790px}.grid{display:block}.tree{padding:18px 26px;min-height:0}.tree ul ul{border-left:1px dashed #dce7df;margin-left:20px;padding-left:24px}.node{padding:13px 12px;min-height:49px}.node.folder{color:var(--green);font-size:19px;font-weight:650}.node.article{font-size:16px}.node .count{background:var(--soft);border-radius:7px;padding:3px 10px;color:var(--green)}.node{user-select:none}.node .grip{color:#98a99f;font-size:15px;cursor:grab}.node.drop-target,.root-drop.drop-target{outline:2px dashed var(--green);background:var(--soft)}.node.dragging{opacity:.35}.detail{border:1px solid #b9deca;border-radius:12px;margin:4px 0 18px;padding:18px 20px;background:#f6fbf8}.detail h3{margin:0 0 4px;font-size:15px}.level-fields{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.level{flex:1;min-width:150px}.level label{margin:0 0 5px}.move-line{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:13px}.destination{font-size:14px}.destination strong{color:var(--green)}.current-path{font-size:13px;color:var(--muted)}.facts{margin-top:12px}.detail details{margin-top:14px;font-size:13px;color:var(--muted)}.detail summary{cursor:pointer}.root-drop{font-size:13px;color:var(--muted);padding:8px 12px;border:1px dashed var(--line);border-radius:8px;margin:0 0 12px}.walk{margin-top:20px}.walk summary{cursor:pointer}.new{padding:18px 22px;border-top:1px solid var(--line)}.preview{margin-top:18px}.public-article{padding:10px}.status{margin:12px 0}.node.public-folder:disabled{opacity:1}.drag-note{font-size:12px;color:var(--muted)}@media(max-width:650px){.head{flex-wrap:wrap}.tree{padding:12px}.tree ul ul{margin-left:8px;padding-left:12px}.detail{padding:13px}.node.folder{font-size:17px}.node.article{font-size:14px}.move-line{align-items:start;flex-direction:column}.level{min-width:130px}.top{gap:12px}}
</style>
<main>
<div class="top"><div><div class="brand">wonder · 写作空间</div><h1>整理你的文章</h1><p class="intro">点一篇文章，在下方按一级、二级目录选择位置；也可以将文章或文件夹拖入目标文件夹。确认发布整理后，读者才看到变化。</p></div><span class="pill">本地原型 · 示例数据</span></div>
<div class="status" role="status" id="status"></div>
<section class="panel"><div class="head"><div><h2>文章目录 <span class="pill" id="pending-count"></span></h2><div class="sub">按文章标题整理 · 公开网址保持不变</div></div><div class="tools"><button id="undo">撤销整理</button><button id="toggle-public" aria-expanded="false">查看已公开目录</button><button id="publish" class="primary">模拟发布整理</button></div></div><div id="workspace" class="tree"></div><div class="new"><label for="new-name">在选中文件夹中新建（选中文章时，使用它所在的文件夹）</label><div class="formrow"><input id="new-name" placeholder="输入文件夹或文章名称"><button id="new-folder">新建文件夹</button><button id="new-article">新建文章</button></div></div><details class="pending"><summary>查看待发布的修改 <span id="change-count"></span></summary><div id="changes"></div><p class="hint">新文章仍是草稿，需要单独确认内容后发布。</p></details></section>
<section class="panel preview" id="published-panel" hidden><div class="head"><h2>当前已公开目录</h2><span class="sub">模拟版本 <span id="version">1</span></span></div><div id="public" class="tree"></div></section>
<details class="walk"><summary>需要指引？试试这几个场景</summary><div class="tools" id="scenarios"></div><p id="guide"></p><div class="tools" id="steps"></div></details>
<div class="tools" style="margin-top:16px"><button id="reset">重置示例</button><span class="drag-note">拖拽：拖到文件夹中移动，拖到“全部文章”回到根目录。手机可使用逐级选择。</span></div>
<p class="footer">仅验证交互，不读写真实文章、不提交 GitHub。所有修改在内存中，刷新即还原。真实路径移动、图片引用维护及稳定网址适配尚未接入。</p>
</main>
<script>
// PROTOTYPE: in-memory model only. No repository or publication side effects.
const Model=(()=>{
 const clone=x=>JSON.parse(JSON.stringify(x));
 const initial=()=>{const nodes=[
 {id:'infra',type:'folder',name:'AI infra',parent:null},
 {id:'cuda',type:'folder',name:'cuda',parent:'infra'},
 {id:'element',type:'article',name:'element-wise.md',title:'CUDA Element-wise 算子',parent:'cuda',url:'/posts/ai-infra/cuda/element-wise/',published:true},
 {id:'writing',type:'folder',name:'随手记',parent:null},
 {id:'codex',type:'article',name:'server-codex-setup.md',title:'服务器加载 Codex',parent:'writing',url:'/posts/writing/server-codex-setup/',published:true},
 {id:'protect',type:'article',name:'protect-server.md',title:'保护服务器',parent:'writing',url:'/posts/writing/protect-server/',published:true},
 {id:'server',type:'folder',name:'服务器',parent:null},
 {id:'linux',type:'folder',name:'Linux',parent:'server'}];return {nodes,publicNodes:clone(nodes),selected:null,version:1,next:1};};
 const path=(nodes,id)=>{const n=nodes.find(x=>x.id===id);return n?[path(nodes,n.parent),n.name].filter(Boolean).join('/'):'';};
 const category=(nodes,n)=>path(nodes,n.parent)||'未分类';
 const descendant=(nodes,id,ancestor)=>id===ancestor||!!nodes.find(n=>n.id===id&&n.parent&&descendant(nodes,n.parent,ancestor));
 const changes=s=>s.nodes.flatMap(n=>{const old=s.publicNodes.find(x=>x.id===n.id);const before=old?path(s.publicNodes,n.id):null,after=path(s.nodes,n.id);return before===after?[]:[{node:n,before,after}];});
 function apply(state,a){const s=clone(state),n=s.nodes.find(x=>x.id===(a.id||s.selected));
  if(a.type==='select'){s.selected=a.id;return s;}
  if(a.type==='publish'){s.publicNodes=clone(s.nodes);s.version++;return s;}
  if(a.type==='move'){
   if(a.parent&&(!s.nodes.some(x=>x.id===a.parent&&x.type==='folder')))throw Error('请选择有效的目标文件夹。');
   if(n.type==='folder'&&a.parent&&descendant(s.nodes,a.parent,n.id))throw Error('不能把文件夹移动到它自身或子文件夹里面。');
   if(n.parent===a.parent)throw Error('已经在这个文件夹里，无需移动。');
   if(s.nodes.some(x=>x.parent===a.parent&&x.name===n.name&&x.id!==n.id))throw Error('目标目录已有同名文件，请先改名。');
   n.parent=a.parent;
  }
  if(a.type==='rename'||a.type==='new'){
   const name=a.name.trim();if(!name||/[\\/]/.test(name)||name==='.'||name==='..')throw Error('请输入一个名称，不包含斜杠或单独的点。');
   const parent=a.type==='rename'?n.parent:a.parent;
   const fileName=a.type==='new'&&a.kind==='article'&&!name.endsWith('.md')?name+'.md':name;
   if(a.type==='rename'&&n.type==='article'&&!name.endsWith('.md'))throw Error('文章文件名请保留 .md 后缀。');
   if(s.nodes.some(x=>x.parent===parent&&x.name===fileName&&(a.type==='new'||x.id!==n.id)))throw Error('这个文件夹中已有同名内容。');
   if(a.type==='rename')n.name=name;
   else {const id='new-'+s.next++;s.nodes.push({id,type:a.kind,name:fileName,parent,title:name.replace(/\.md$/,''),url:null,published:false});s.selected=id;}
  }
  return s;
 }
 return {initial,path,category,descendant,changes,apply,clone};
})();
let state=Model.initial(),history=[],message='点击文章标题，下方就会展开目录选择。',scenario=0,step=0,targetParent=null,dragged=null;
const scenarios=[
 {name:'① 移动一篇文章',text:'把《保护服务器》移到“服务器 / Linux”。观察默认分类和网址，再点“查看已公开目录”比较发布前后。',steps:[['移到服务器 / Linux',{type:'move',id:'protect',parent:'linux'}],['模拟发布整理',{type:'publish'}]]},
 {name:'② 整个文件夹改名',text:'“随手记”里有两篇文章。改名会一起调整它们的路径和分类，但两篇文章的网址都保留。',steps:[['随手记 → 运维笔记',{type:'rename',id:'writing',name:'运维笔记'}],['模拟发布整理',{type:'publish'}]]},
 {name:'③ 移错了怎么办',text:'先移动，再撤销。撤销只还原未发布的整理，已经公开的版本不受影响。',steps:[['移动文章',{type:'move',id:'protect',parent:'linux'}],['撤销这次整理',{type:'undo'}]]},
 {name:'④ 不允许的移动',text:'试着把“服务器”放进它自己的“Linux”子文件夹。这个操作会被拒绝，目录保持原样。',steps:[['尝试移动到自身子目录',{type:'move',id:'server',parent:'linux'}]]}
];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function act(a){try{
 if(a.type==='undo'){if(!history.length)return;state=history.pop();message='已撤销上一次整理，公开版本没有变化。';}
 else {const old=state,next=Model.apply(state,a);if(a.type!=='select'&&a.type!=='publish')history.push(Model.clone(old));state=next;
 if(a.type==='publish'){history=[];message='模拟发布完成：公开目录已更新，已有文章网址保持不变。';}
 else if(a.type==='select')message='已选中，可以在文章下方逐级选择新的位置。';
 else message='已暂存整理，公开目录尚未变化。可继续整理或撤销。';}
 }catch(e){message=e.message;}
 targetParent=state.nodes.find(n=>n.id===state.selected)?.parent||null;render();}
function hasPublished(nodes,id){return nodes.some(n=>n.type==='article'&&n.published&&Model.descendant(nodes,n.id,id));}
function tree(nodes,parent=null,pub=false){return '<ul>'+nodes.filter(n=>n.parent===parent&&(!pub||(n.type==='folder'?hasPublished(nodes,n.id):n.published))).map(n=>{
 const selected=!pub&&state.selected===n.id;
 const row=pub?(n.type==='folder'?`<div class="node folder public-folder"><span class="glyph">⌄</span>${esc(n.name)}<span class="count">${nodes.filter(x=>x.type==='article'&&x.published&&Model.descendant(nodes,x.id,n.id)).length}</span></div>`:`<div class="public-article">${esc(n.title)}<small>${esc(n.url)}</small></div>`):`<button class="node ${n.type} ${selected?'selected':''}" draggable="false" data-select="${esc(n.id)}" ${n.type==='folder'?`data-drop="${esc(n.id)}"`:''}><span class="grip" aria-hidden="true">⠿</span><span class="glyph">${n.type==='folder'?'⌄':'·'}</span>${esc(n.type==='folder'?n.name:n.title)}<span class="count">${n.type==='folder'?nodes.filter(x=>x.type==='article'&&Model.descendant(nodes,x.id,n.id)).length:n.published?'已发布':'草稿'}</span></button>`;
 return '<li>'+row+(selected?'<div id="detail" class="detail"></div>':'')+(n.type==='folder'?tree(nodes,n.id,pub):'')+'</li>';
 }).join('')+'</ul>';}
function renderDestination(){
 const n=state.nodes.find(x=>x.id===state.selected);if(!n)return;
 let chain=[],p=targetParent;while(p){chain.unshift(p);p=state.nodes.find(x=>x.id===p)?.parent;}
 let html='',parent=null;for(let i=0;i<=chain.length;i++){
 const children=state.nodes.filter(x=>x.type==='folder'&&x.parent===parent&&!(n.type==='folder'&&Model.descendant(state.nodes,x.id,n.id)));
 if(!children.length&&i>0)break;
 const label=['一级目录','二级目录','三级目录','四级目录'][i]||('第 '+(i+1)+' 级目录');
 html+=`<div class="level"><label for="level-${i}">${label}</label><select id="level-${i}" data-level="${i}" data-parent="${parent||''}"><option value="">${i===0?'全部文章（根目录）':'留在当前目录'}</option>${children.map(x=>`<option value="${x.id}" ${chain[i]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
 if(!chain[i])break;parent=chain[i];
 }
 $('levels').innerHTML=html;$('destination-text').textContent=Model.path(state.nodes,targetParent).replaceAll('/',' / ')||'全部文章';$('move').disabled=targetParent===n.parent;
 document.querySelectorAll('[data-level]').forEach(select=>select.onchange=()=>{targetParent=select.value||select.dataset.parent||null;renderDestination();});
}
function renderDetail(){const n=state.nodes.find(x=>x.id===state.selected);if(!n)return;
 $('detail').innerHTML=`<h3>移动${n.type==='folder'?'文件夹':'文章'} · ${esc(n.title||n.name)}</h3><p class="current-path">当前位置：全部文章 / ${esc(Model.path(state.nodes,n.parent).replaceAll('/',' / ')||'根目录')}</p><div class="level-fields" id="levels"></div><div class="move-line"><span class="destination">移动到：<strong id="destination-text"></strong></span><button id="move" class="primary">移动到这里</button></div><p class="hint">分类跟随目标目录，${n.type==='folder'?'子文章一起移动，':''}已有公开网址不变。</p><details><summary>文件信息与重命名</summary><dl class="facts"><dt>文件路径</dt><dd>src/content/posts/${esc(Model.path(state.nodes,n.id))}</dd><dt>默认分类</dt><dd>${n.type==='article'?esc(Model.category(state.nodes,n)):'子文章跟随各自目录'}</dd><dt>公开网址</dt><dd class="url">${n.type==='article'?esc(n.url||'首次发布时确定'):'子文章网址保持不变'}</dd></dl><label for="rename">${n.type==='article'?'文件名（文章标题不变）':'文件夹名称'}</label><div class="formrow"><input id="rename" value="${esc(n.name)}"><button id="rename-button">确认改名</button></div></details>`;
 $('move').onclick=()=>act({type:'move',parent:targetParent});$('rename-button').onclick=()=>act({type:'rename',name:$('rename').value});renderDestination();}
function render(){
 $('workspace').innerHTML='<div class="root-drop" data-drop="">全部文章 · 拖到这里移回根目录</div>'+tree(state.nodes);$('public').innerHTML=tree(state.publicNodes,null,true);$('version').textContent=state.version;$('status').textContent=message;
 const c=Model.changes(state);$('pending-count').textContent=c.length?'有待发布整理':'与公开目录一致';$('change-count').textContent=c.length?'（'+c.length+' 项）':'';$('undo').disabled=!history.length;$('publish').disabled=!c.length;
 renderDetail();
 $('changes').innerHTML=c.length?c.map(x=>`<div class="change"><strong>${esc(x.node.title||x.node.name)}${!x.node.published&&x.node.type==='article'?' · 仅草稿':''}</strong><span>${esc(x.before||'新建')} → ${esc(x.after)}</span>${x.node.published?'<span>网址不变：'+esc(x.node.url)+'</span>':''}</div>`).join(''):'<p class="empty">没有待发布整理。</p>';
 document.querySelectorAll('[data-select]').forEach(b=>{
 b.onclick=()=>{if(suppressClick){suppressClick=false;return;}act({type:'select',id:b.dataset.select});};
 b.onpointerdown=e=>{if(e.pointerType!=='mouse'||e.button!==0)return;gesture={id:b.dataset.select,x:e.clientX,y:e.clientY,button:b};};
 });
 $('scenarios').innerHTML=scenarios.map((s,i)=>`<button class="${i===scenario?'active':''}" data-scenario="${i}" aria-pressed="${i===scenario}">${s.name}</button>`).join('');
 document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{scenario=Number(b.dataset.scenario);step=0;state=Model.initial();history=[];targetParent=null;message='已还原示例，可以按步骤体验，也可以自由操作。';render();});
 $('guide').textContent=scenarios[scenario].text;$('steps').innerHTML=scenarios[scenario].steps.map(([label],i)=>`<button data-step="${i}" ${i!==step?'disabled':''}>${i<step?'✓':i+1+'.'} ${label}</button>`).join('');
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const action=scenarios[scenario].steps[Number(b.dataset.step)][1];if(action.id)state.selected=action.id;step++;act(action);});
}
let gesture=null,suppressClick=false;
document.addEventListener('pointermove',e=>{
 if(!gesture)return;if(!dragged&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<8)return;
 dragged=gesture.id;gesture.button.classList.add('dragging');
 document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(target)target.classList.add('drop-target');
});
document.addEventListener('pointerup',e=>{
 if(!gesture)return;const id=dragged,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');
 gesture=null;dragged=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'));
 if(id){suppressClick=true;setTimeout(()=>suppressClick=false,0);if(target){state.selected=id;act({type:'move',id,parent:target.dataset.drop||null});}}
});
document.addEventListener('pointercancel',()=>{gesture=null;dragged=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'));});
function create(kind){const n=state.nodes.find(x=>x.id===state.selected);act({type:'new',kind,name:$('new-name').value,parent:n?(n.type==='folder'?n.id:n.parent):null});$('new-name').value='';}
$('new-folder').onclick=()=>create('folder');$('new-article').onclick=()=>create('article');$('undo').onclick=()=>act({type:'undo'});$('publish').onclick=()=>act({type:'publish'});$('toggle-public').onclick=()=>{const p=$('published-panel');p.hidden=!p.hidden;$('toggle-public').setAttribute('aria-expanded',String(!p.hidden));};$('reset').onclick=()=>{state=Model.initial();history=[];step=0;targetParent=null;message='已重置示例，点击文章试试逐级选择目录。';render();};render();
</script>
</html>
