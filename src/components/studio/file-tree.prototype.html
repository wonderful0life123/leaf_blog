let variant=new URLSearchParams(location.search).get('variant')||'A',scope=null;
if(!['A','B','C'].includes(variant))variant='A';
const variantInfo={A:['文章工作台','在目录中切换文章，阅读与整理留在同一屏。'],B:['文章目录','像浏览博客一样，直接整理你的文章。'],C:['文档资料库','按目录查找，集中管理文章与属性。']};
const panel=document.querySelector('section.panel');panel.classList.add('content-panel');
const layout=document.createElement('div');layout.className='layout';layout.id='layout';panel.before(layout);layout.append(panel);
const nav=document.createElement('aside');nav.className='folder-nav';nav.id='folder-nav';nav.setAttribute('aria-label','目录导航');layout.prepend(nav);
const reader=document.createElement('aside');reader.className='reading-pane';reader.id='reading-pane';reader.setAttribute('aria-label','文章预览');layout.append(reader);
const inspector=document.createElement('aside');inspector.className='inspector';inspector.id='inspector';inspector.setAttribute('aria-label','文章属性');layout.append(inspector);
const switcher=document.createElement('nav');switcher.className='variant-switch';switcher.setAttribute('aria-label','设计方案切换');switcher.innerHTML='<span class="switch-label">设计对比</span><button class="arrow" data-cycle="-1" aria-label="上一个方案">‹</button><button data-variant="A">A · 阅读工作台</button><button data-variant="B">B · 目录直编</button><button data-variant="C">C · 文档资料库</button><button class="arrow" data-cycle="1" aria-label="下一个方案">›</button>';document.body.append(switcher);
const excerpt={protect:['服务器的安全，从日常习惯开始。记录一次环境检查，也整理出一份下次可以直接使用的清单。','先确认正在运行的服务','ss -lntup\nsystemctl --failed\ndocker ps','只保留预期端口、预期容器和预期服务。'],codex:['终端找不到已经安装的 Codex 时，先检查当前 shell 是否加载了正确的 Node 环境。','检查当前环境','which node\nwhich codex\nnode --version','把排查过程记录下来，下次就不必重新开始。'],element:['从一个最简单的逐元素运算开始，理解线程索引、边界判断与访存方式。','找到每个线程负责的位置','int idx = blockIdx.x * blockDim.x + threadIdx.x;\nif (idx < n) out[idx] = a[idx] + b[idx];','先写清楚，再测量，再优化。']};
function readerContent(n){if(!n)return '<div class="inspector-empty">选一篇文章，在这里阅读与整理。</div>';if(n.type==='folder')return `<div class="read-head"><span>${esc(path(n.parent))}</span><button data-more="${n.id}">${icon('more')}</button></div><div class="read-document"><div class="document-kicker">FOLDER</div><h2>${esc(n.name)}</h2><p>${state.nodes.filter(x=>Model.descendant(state.nodes,x.id,n.id)&&x.type==='article').length} 篇文章 · 子目录与文章可以一起移动</p><div class="folder-items">${state.nodes.filter(x=>x.parent===n.id).map(x=>`<button data-select="${x.id}">${icon(x.type==='folder'?'folder':'file')}${esc(name(x))}</button>`).join('')||'<span class="muted small">还没有内容</span>'}</div></div>`;
const p=excerpt[n.id]||['把学习与生活中的片段整理成文章，让每一次记录都有迹可循。','记录与思考','记录问题 → 尝试解决 → 留下笔记','这是一段本地示例正文，用来感受阅读与管理的布局。'];return `<div class="read-head"><span>${esc(path(n.parent))}</span><button class="soft" data-open="${n.id}">${icon('edit')}进入写作</button></div><article class="read-document"><div class="document-kicker">${n.published?'PUBLISHED':'DRAFT'} · ${esc(node(n.parent)?.name||'未分类')}</div><h2>${esc(name(n))}</h2><div class="document-meta"><span>2026 年 10 月 15 日</span><span>正文示意</span></div><p>${esc(p[0])}</p><h3>${esc(p[1])}</h3><pre>${esc(p[2])}</pre><blockquote>${esc(p[3])}</blockquote></article>`;}
function navTree(parent=null){return '<ul>'+state.nodes.filter(n=>n.type==='folder'&&n.parent===parent).map(n=>`<li><div class="nav-row ${scope===n.id?'active':''}" data-id="${n.id}" data-drop="${n.id}"><button data-scope="${n.id}">${icon('folder')}<span>${esc(n.name)}</span></button><button class="icon more" data-more="${n.id}" aria-label="${esc(n.name)} 目录操作">${icon('more')}</button></div>${navTree(n.id)}</li>`).join('')+'</ul>';}
const baseMatches=matches;
matches=function(n){return baseMatches(n)&&(variant!=='C'||!scope||Model.descendant(state.nodes,n.id,scope));};
const baseRow=row;
row=function(n){let html=baseRow(n);if(n.type==='article')html=html.replace('<button class="icon more"',`<button class="edit-quick" data-open="${n.id}" aria-label="编辑 ${esc(name(n))}">编辑</button><button class="icon more"`);return html;};
select=function(id){state.selected=id;targetParent=selected()?.parent||null;moveOpen=true;searchDestination=false;closeMenu();render();};
const baseRender=render;
render=function(){
 // Clear relocated controls first: ID lookups must always point at the new selection.
 reader.innerHTML='';inspector.innerHTML='';if(selected())moveOpen=true;
 document.body.dataset.variant=variant;document.querySelector('h1').textContent=variantInfo[variant][0];document.querySelector('.heading p').textContent=variantInfo[variant][1];
 if(variant==='C')view='list';
 baseRender();
 nav.innerHTML='<div class="nav-label">我的目录</div><button class="root-nav" data-scope="" data-drop="">'+icon('folder')+'全部文章</button>'+navTree()+'<button class="add-folder" id="nav-new-folder">'+icon('plus')+'新建文件夹</button>';
 nav.querySelector('#nav-new-folder').onclick=()=>newItem('folder',scope);
 const n=selected(),inline=$('workspace').querySelector('.inline');
 if(variant==='A'){
 reader.innerHTML=readerContent(n)+(n?'<section class="position-dock"><div class="dock-title">文章位置 <small>移动不会更改已有网址</small></div><div id="dock-content"></div></section>':'');
 if(inline)reader.querySelector('#dock-content').append(inline);else if(n){reader.querySelector('#dock-content').innerHTML=detail(n);bindMoveControls();}
 }else if(variant==='C'){
 if(n){inspector.innerHTML=`<div class="inspector-top">文章属性<button class="icon" id="close-inspector" aria-label="收起文章属性">×</button></div><h2>${esc(name(n))}</h2><p class="inspector-meta">${n.type==='folder'?'文件夹':n.published?'已发布 · 10 月 15 日更新':'草稿 · 尚未发布'}</p><button class="soft open-button" ${n.type==='article'?`data-open="${n.id}"`:`data-new-child="${n.id}"`}>${icon(n.type==='article'?'edit':'plus')}${n.type==='article'?'进入写作':'新建子目录'}</button><section class="position-dock"><div class="dock-title">所在目录</div><div id="inspector-content"></div></section><div class="inspector-info">${esc(n.type==='article'?n.name:'整个文件夹及子内容一起移动')}<br><button data-more="${n.id}">更多操作 ${icon('down')}</button></div>`;if(inline)inspector.querySelector('#inspector-content').append(inline);else{inspector.querySelector('#inspector-content').innerHTML=detail(n);bindMoveControls();}
 $('close-inspector').onclick=()=>{state.selected=null;moveOpen=false;render();};}else inspector.innerHTML='<div class="inspector-empty">'+icon('file')+'<p style="margin-top:12px">选择文章，查看与调整属性</p></div>';
 $('root-label').innerHTML=icon('folder')+esc(scope?path(scope):'全部文章');
 }
 layout.classList.toggle('has-selection',!!n);
 // Every variant uses progressive selectors immediately on selection, without a second "move" click.
 if(n&&$('toggle-move'))$('toggle-move').hidden=true;
 if(n&&$('cancel-move'))$('cancel-move').onclick=()=>{state.selected=null;moveOpen=false;render();};
 switcher.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-current',b.dataset.variant===variant?'true':'false');});
};
function bindMoveControls(){if(!moveOpen)return;$('find-destination').onclick=()=>{searchDestination=!searchDestination;render();};$('confirm-move').onclick=()=>act({type:'move',parent:targetParent});renderDestination();}
// Shared action handlers; each layout places the controls in a different working area.
reader.onclick=inspector.onclick=$('workspace').onclick;
nav.onclick=e=>{if(suppressClick)return;const b=e.target.closest('button');if(!b)return;if(b.dataset.more){menu(b,b.dataset.more);return;}if(b.dataset.scope!==undefined){scope=b.dataset.scope||null;state.selected=null;moveOpen=false;render();}};
nav.addEventListener('pointerdown',e=>{const r=e.target.closest('[data-id]');if(e.pointerType==='mouse'&&e.button===0&&r&&!e.target.closest('[data-more]'))gesture={id:r.dataset.id,x:e.clientX,y:e.clientY};});
function switchVariant(next){variant=next;scope=null;view=variant==='C'?'list':'tree';filter='all';query='';$('search').value='';state.selected=state.nodes.some(n=>n.id==='protect')?'protect':articles()[0]?.id;moveOpen=!!state.selected;targetParent=selected()?.parent||null;searchDestination=false;closeMenu();const u=new URL(location.href);u.searchParams.set('variant',variant);window.history.replaceState(null,'',u);render();}
switcher.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant)switchVariant(b.dataset.variant);if(b.dataset.cycle)switchVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+Number(b.dataset.cycle)+3)%3]);};
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.closest('input,textarea,button,[contenteditable],dialog'))return;e.preventDefault();switchVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+(e.key==='ArrowRight'?1:2))%3]);});
const baseAct=act;
act=function(a){const ok=baseAct(a);if(ok&&state.selected){moveOpen=true;targetParent=selected().parent;render();const r=document.querySelector(`.row[data-id="${state.selected}"]`);r?.classList.add('updated-row');if(variant==='A')r?.scrollIntoView({block:'nearest'});}return ok;};

// A was selected by the user. This refinement still uses scratch data, never the live Studio API.
let mobilePane='tree',lastRenderedSelection=null,compareOpen=false,moveSheetId=null,animateMoveSheet=false;
const footActions=document.createElement('span');footActions.className='foot-actions';$('undo').before(footActions);footActions.append($('undo'));
const compareButton=document.createElement('button');compareButton.className='compare-toggle';compareButton.textContent='方案对比';footActions.append(compareButton);
compareButton.onclick=()=>{compareOpen=!compareOpen;switcher.hidden=!compareOpen;compareButton.textContent=compareOpen?'收起对比':'方案对比';};
function creationParent(){const n=selected();return n?.type==='folder'?n.id:n?.parent||null;}
$('new-article').onclick=()=>newItem('article',variant==='A'?creationParent():null);
function breadcrumbs(id){let chain=[];while(id){const n=node(id);chain.unshift(n);id=n.parent;}return `<nav class="breadcrumbs" aria-label="当前文章位置"><button data-select-root>全部文章</button>${chain.map(n=>icon('chevron')+`<button data-select="${n.id}">${esc(n.name)}</button>`).join('')}</nav>`;}
const originalReaderContent=readerContent;
readerContent=function(n){
 if(variant!=='A')return originalReaderContent(n);
 if(!n)return '<div class="read-head">阅读与整理</div><div class="read-document inspector-empty">'+icon('file')+'<h3 style="margin-top:16px">从左侧选一篇文章</h3><p>单击阅读，拖动整理目录。<br>也可以从右上角开始一篇新文章。</p></div>';
 const head=`<div class="read-head"><button class="mobile-back" data-back-tree>‹ 文章目录</button>${breadcrumbs(n.parent)}<div class="read-actions"><button class="icon" data-more="${n.id}" aria-label="当前${n.type==='article'?'文章':'文件夹'}更多操作">${icon('more')}</button>${n.type==='article'?`<button class="primary" data-open="${n.id}">${icon('edit')}编辑文章</button>`:''}</div></div>`;
 if(n.type==='article')return head+originalReaderContent(n).replace(/^.*?<article/s,'<article').replace('PUBLISHED','已发布').replace('DRAFT','草稿');
 const children=state.nodes.filter(x=>x.parent===n.id);
 return head+`<div class="read-document"><div class="document-kicker">文件夹</div><h2>${esc(n.name)}</h2><p>${children.filter(x=>x.type==='folder').length} 个子目录 · ${children.filter(x=>x.type==='article').length} 篇直属文章</p><div class="folder-tools"><button class="soft" data-create-article="${n.id}">${icon('plus')}新建文章</button><button class="border" data-new-child="${n.id}">${icon('folder')}新建子目录</button></div><div class="folder-items">${children.map(x=>`<button class="folder-entry" data-select="${x.id}">${icon(x.type==='folder'?'folder':'file')}<span>${esc(name(x))}</span><small>${x.type==='folder'?'文件夹':x.published?'已发布':'草稿'}</small>${icon('chevron')}</button>`).join('')||'<p>这里还没有内容。新建一篇文章，或把左侧的文章拖进来。</p>'}</div></div>`;
};
function updatePlacement(){
 if(variant!=='A'||!selected()||!$('destination-text'))return;
 const changed=targetParent!==selected().parent,dock=reader.querySelector('.position-dock');
 if(!dock)return;dock.classList.toggle('changed',changed);dock.classList.toggle('searching',searchDestination);
 $('destination-text').parentElement.innerHTML=(changed?'即将移至 ':'当前位置：')+`<strong id="destination-text">${esc(path(targetParent))}</strong>`;
 $('confirm-move').textContent='确认移动';$('cancel-move').textContent='取消';$('cancel-move').disabled=false;
 $('cancel-move').onclick=()=>closeMoveSheet();
}
const workbenchRender=render;
render=function(){
 const treeTop=$('workspace').scrollTop,docTop=reader.querySelector('.read-document')?.scrollTop||0,same=lastRenderedSelection===state.selected;
 if(moveSheetId&&moveSheetId!==state.selected)moveSheetId=null;
 workbenchRender();document.body.dataset.mobilePane=mobilePane;
 switcher.hidden=variant==='A'&&!compareOpen;
 if(variant==='A'){
 $('workspace').scrollTop=treeTop;
 const doc=reader.querySelector('.read-document');if(doc&&same)doc.scrollTop=docTop;
 $('new-article').title='新建于：'+path(creationParent());
 $('summary').innerHTML=`${articles().filter(matches).length} 篇文章 · ${state.nodes.filter(n=>n.type==='folder').length} 个目录<div class="tree-hint">单击阅读 · 拖动移动 · 右键更多操作</div>`;
 $('workspace').querySelectorAll('[data-select]').forEach(b=>{b.removeAttribute('aria-expanded');if(b.dataset.select===state.selected)b.setAttribute('aria-current','true');b.title=name(node(b.dataset.select));});
 const dock=reader.querySelector('.position-dock');if(dock){
 const open=moveSheetId===state.selected;dock.hidden=!open;dock.setAttribute('role','dialog');dock.setAttribute('aria-modal','false');dock.setAttribute('aria-labelledby','move-sheet-title');
 dock.querySelector('.dock-title').innerHTML=`<div class="sheet-heading"><strong id="move-sheet-title">移动${selected().type==='folder'?'文件夹':''}「${esc(name(selected()))}」</strong><small>${selected().type==='folder'?'子目录和文章一起移动 · ':''}已有网址保持不变</small></div><div class="sheet-actions"><button id="dock-search">${searchDestination?'逐级选择':'搜索目录'}</button><button class="icon" id="close-move-sheet" aria-label="关闭移动面板">×</button></div>`;
 $('close-move-sheet').onclick=()=>closeMoveSheet();$('dock-search').onclick=()=>{searchDestination=!searchDestination;render();$('destination-search')?.focus();};updatePlacement();
 if(open&&animateMoveSheet){dock.classList.add('sheet-enter');animateMoveSheet=false;dock.querySelector('[data-picker],#destination-search,#close-move-sheet')?.focus({preventScroll:true});}
 }
 }
 lastRenderedSelection=state.selected;
};
const workbenchSelect=select;
select=function(id){if(state.selected!==id)moveSheetId=null;mobilePane='reader';workbenchSelect(id);};
const sharedReaderClick=reader.onclick;
reader.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-back-tree')){mobilePane='tree';render();return;}if(b.hasAttribute('data-select-root')){state.selected=null;mobilePane='tree';render();return;}if(b.dataset.createArticle){newItem('article',b.dataset.createArticle);return;}sharedReaderClick(e);};
$('workspace').addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(!r||variant!=='A')return;e.preventDefault();select(r.dataset.id);menu($('workspace').querySelector(`[data-more="${r.dataset.id}"]`),r.dataset.id);});
$('workspace').addEventListener('keydown',e=>{
 if(variant!=='A'||!e.target.closest('[data-select]'))return;
 const buttons=[...$('workspace').querySelectorAll('[data-select]')],index=buttons.indexOf(e.target.closest('[data-select]')),n=node(buttons[index]?.dataset.select);
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const b=buttons[Math.max(0,Math.min(buttons.length-1,index+(e.key==='ArrowDown'?1:-1)))];select(b.dataset.select);$('workspace').querySelector(`[data-select="${b.dataset.select}"]`)?.focus();}
 if(['ArrowLeft','ArrowRight'].includes(e.key)&&n?.type==='folder'){e.preventDefault();e.key==='ArrowLeft'?expanded.delete(n.id):expanded.add(n.id);render();$('workspace').querySelector(`[data-select="${n.id}"]`)?.focus();}
 if(e.key==='F2'&&n){e.preventDefault();rename(n);}
});
document.addEventListener('keydown',e=>{if(variant==='A'&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,[contenteditable],dialog')){e.preventDefault();act({type:'undo'});}});
// Keep drag targets reachable in long directory lists and communicate the destination.
document.addEventListener('pointermove',e=>{if(variant!=='A'||!dragged)return;const box=$('workspace').getBoundingClientRect();if(e.clientX>=box.left&&e.clientX<=box.right){if(e.clientY<box.top+40)$('workspace').scrollTop-=14;else if(e.clientY>box.bottom-40)$('workspace').scrollTop+=14;}const target=dropTarget(e);$('drag-ghost').textContent=name(node(dragged))+(target?' → '+path(target.dataset.drop||null):' · 拖到目标文件夹');});


// The reading workbench reveals placement only after an explicit Move action.
function closeMoveSheet(){
 const dock=reader.querySelector('.position-dock');if(!moveSheetId||!dock||dock.hidden)return;
 const closingId=moveSheetId;dock.classList.remove('sheet-enter');dock.classList.add('sheet-leave');dock.inert=true;
 const finish=()=>{if(moveSheetId!==closingId||!dock.isConnected)return;moveSheetId=null;targetParent=selected()?.parent||null;searchDestination=false;render();reader.querySelector('.read-actions [data-more]')?.focus({preventScroll:true});};
 setTimeout(finish,matchMedia('(prefers-reduced-motion: reduce)').matches?0:180);
}
const workbenchMenuClick=$('menu').onclick;
$('menu').onclick=e=>{
 const b=e.target.closest('[data-command]');
 if(variant!=='A'||b?.dataset.command!=='move')return workbenchMenuClick(e);
 const n=node($('menu').dataset.node);if(!n)return;
 state.selected=n.id;targetParent=n.parent;searchDestination=false;moveOpen=true;moveSheetId=n.id;animateMoveSheet=true;mobilePane='reader';closeMenu();render();
};
const workbenchAct=act;
act=function(a){
 const previousSheet=moveSheetId;
 if(variant==='A')moveSheetId=null;
 const ok=workbenchAct(a);
 if(!ok&&previousSheet){moveSheetId=previousSheet;render();}
 else if(ok&&previousSheet&&variant==='A')reader.querySelector('.read-actions [data-more]')?.focus({preventScroll:true});
 return ok;
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&variant==='A'&&moveSheetId&&!$('dialog').open){e.preventDefault();closeMoveSheet();}});

// Start each comparison with the same selected sample article.
state.selected='protect';targetParent='writing';moveOpen=true;
switchVariant(variant);

</script>
</body>
</html>
