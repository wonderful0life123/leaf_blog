# Insert these locations into the EXISTING HTTPS server for wonder-ai.info.
# Keep existing /, /v1/, /responses, /byok/ and all unrelated locations unchanged.
location = /studio {
    return 302 /studio/;
}
location ^~ /studio/ {
    proxy_pass http://127.0.0.1:4312;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
}
location ^~ /studio-api/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:4312;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
}
location ^~ /studio-auth/ {
    # OAuth codes are short-lived credentials; omit callback query strings from logs.
    access_log off;
    error_log /var/log/nginx/wonder-studio-auth.error.log crit;
    proxy_pass http://127.0.0.1:4312;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
}
location ^~ /studio-static/ {
    proxy_pass http://127.0.0.1:4312;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
}
